<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bhakundo Live </title>

  <!-- IMPORTANT: Ask browser to NOT send Referer -->
  <meta name="referrer" content="no-referrer" />

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #000;
    }
    #video-container {
      width: 100%;
      max-width: 800px;
      position: relative;
    }
    video {
      width: 100%;
      height: auto;
      background: #000;
    }
    #watermark {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-size: 12px;
      background-color: rgba(0, 0, 0, 0.5);
      padding: 2px 5px;
      border-radius: 3px;
      font-family: Arial, sans-serif;
      pointer-events: none;
      user-select: none;
    }
    #fullscreen-button {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      background-color: rgba(0, 0, 0, 0.7);
      border: none;
      padding: 8px 12px;
      font-size: 14px;
      border-radius: 5px;
      cursor: pointer;
      font-family: Arial, sans-serif;
    }
    #fullscreen-button:hover {
      background-color: rgba(255, 255, 255, 0.3);
    }
    #error-message {
      display: none;
      color: white;
      font-size: 18px;
      text-align: center;
      background-color: rgba(0, 0, 0, 0.8);
      padding: 20px;
      border-radius: 10px;
      font-family: Arial, sans-serif;
      margin: 0 16px;
    }
  </style>
  <!-- money tag ads -->
</head>

<body>
  <div id="video-container">
    <video id="video" controls autoplay playsinline></video>
    <div id="watermark">Bhakundo TV</div>
    <button id="fullscreen-button">Make Fullscreen</button>
    <div id="error-message">
      We are updating our live link. Please come back after some minutes from the app. Thank you.
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const url = params.get('url');

    const video = document.getElementById('video');
    const errorMessage = document.getElementById('error-message');
    const watermark = document.getElementById('watermark');
    const fullscreenButton = document.getElementById('fullscreen-button');

    function showError() {
      errorMessage.style.display = 'block';
      video.style.display = 'none';
      watermark.style.display = 'none';
      fullscreenButton.style.display = 'none';
    }

    function normalizeUrl(u) {
      // URLSearchParams already decodes, but keep it safe
      try {
        return decodeURIComponent(u);
      } catch (_) {
        return u;
      }
    }

    if (!url) {
      showError();
    } else {
      const streamUrl = normalizeUrl(url);

      if (Hls.isSupported()) {
        const hls = new Hls({
          // Enforce no-referrer for Hls.js fetch requests (playlist + segments)
          fetchSetup: (context, initParams) => {
            initParams.referrerPolicy = 'no-referrer';
            return new Request(context.url, initParams);
          },
        });

        hls.loadSource(streamUrl);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          video.play().catch(() => {});
        });

        hls.on(Hls.Events.ERROR, (event, data) => {
          // If you want to show error on fatal issues, uncomment:
          if (data && data.fatal) showError();
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        // Safari native HLS (relies on the meta referrer policy above)
        video.src = streamUrl;

        video.addEventListener('loadedmetadata', () => {
          video.play().catch(() => {});
        });

        video.addEventListener('error', () => {
          showError();
        });
      } else {
        showError();
      }
    }

    fullscreenButton.addEventListener('click', () => {
      if (video.requestFullscreen) {
        video.requestFullscreen();
      } else if (video.webkitEnterFullscreen) {
        video.webkitEnterFullscreen(); // iOS Safari
      } else if (video.msRequestFullscreen) {
        video.msRequestFullscreen();
      }
    });
  </script>
</body>
</html>
